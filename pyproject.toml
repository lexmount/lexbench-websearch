[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lexbench-websearch"
version = "0.1.0"
description = "Versioned Web Search benchmark tasks, provenance and deterministic retrieval scoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "LexMount"}]
dependencies = []

[project.urls]
Repository = "https://github.com/lexmount/lexbench-websearch"
Issues = "https://github.com/lexmount/lexbench-websearch/issues"

[project.scripts]
lexbench-websearch = "lexbench_websearch.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexbench_websearch = ["definitions/*.json", "definitions/*.txt", "definitions/datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]
